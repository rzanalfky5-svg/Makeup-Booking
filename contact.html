    <form>

        <label>الاسم:</label><br>

        <br><br>

        <label>الرسالة أو التعليق:</label><br>
        <textarea name="message" rows="5" cols="30" required></textarea>

        <br><br>

        <input type="submit" value="إرسال">

    </form>
