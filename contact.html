<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - لمسة جمال</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #fff0f5;
            color: #63304f;
            padding: 20px;
        }

        main {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px #e8c8dc;
        }

        h1 {
            text-align: center;
            color: #a34d87;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #d9a4c2;
            border-radius: 8px;
        }

        button {
            width: 100%;
            background: #a34d87;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 17px;
        }

        a {
            color: #a34d87;
        }
    </style>
</head>

<body>

    <main>
        <h1>تسجيل الدخول</h1>

        <p>أهلاً بعودتكِ إلى لمسة جمال 💗</p>

        <form>
            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" required>

            <label for="password">كلمة المرور:</label>
            <input type="password" id="password" required>

            <button type="submit">دخول</button>
        </form>

        <p><a href="booking.html">حجز موعد</a></p>

        <p><a href="index.html">العودة إلى الرئيسية</a></p>
    </main>

</body>
</html>
