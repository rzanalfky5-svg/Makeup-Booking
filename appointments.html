<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حجز موعد - لمسة جمال</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #fff0f5;
            color: #63304f;
            margin: 0;
            padding: 20px;
        }

        main {
            max-width: 550px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px #e8c8dc;
        }

        h1, h2 {
            text-align: center;
            color: #a34d87;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #d9a4c2;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: #a34d87;
            color: white;
            border: none;
            padding: 14px;
            margin-top: 20px;
            border-radius: 10px;
            font-size: 18px;
            font-family: inherit;
        }

        a {
            color: #a34d87;
        }
    </style>
</head>

<body>

    <main>
        <h1>🌸 حجز موعد</h1>

        <p>يرجى إدخال بياناتكِ واختيار الموعد المناسب.</p>

        <form action="appointments.html" method="get">

            <label for="name">الاسم الكامل:</label>
            <input type="text" id="name" name="name"
                   placeholder="أدخلي اسمكِ الكامل" required>

            <label for="phone">رقم الهاتف:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="أدخلي رقم هاتفكِ" required>

            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" name="email"
                   placeholder="أدخلي بريدكِ الإلكتروني">

            <label for="date">تاريخ الموعد:</label>
            <input type="date" id="date" name="date" required>

            <label for="time">وقت الموعد:</label>
            <input type="time" id="time" name="time" required>

            <label for="notes">ملاحظات إضافية:</label>
            <textarea id="notes" name="notes" rows="4"
                      placeholder="اكتبي أي ملاحظات هنا"></textarea>

            <button type="submit">إرسال طلب الحجز 💗</button>

        </form>

        <p><a href="index.html">العودة إلى الصفحة الرئيسية</a></p>
    </main>

</body>
</html>
