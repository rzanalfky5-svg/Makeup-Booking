<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد للزبونة</title>
  <link rel="stylesheet" href="style.css">

<body>

    <h1>حجز موعد للزبونة</h1>

    <p>مرحباً بكِ، يرجى إدخال بياناتك لحجز موعد.</p>

    <hr>

    <h2>استمارة حجز الموعد</h2>

    <form>

        <label>الاسم الكامل:</label>
        <br>
        <input type="text" name="name" placeholder="أدخلي الاسم الكامل" required>

        <br><br>

        <label>رقم الهاتف:</label>
        <br>
        <input type="tel" name="phone" placeholder="أدخلي رقم الهاتف" required>

        <br><br>

        <label>البريد الإلكتروني:</label>
        <br>
        <input type="email" name="email" placeholder="أدخلي البريد الإلكتروني">

        <br><br>

        <label>تاريخ الموعد:</label>
        <br>
        <input type="date" name="date" required>

        <br><br>

        <label>وقت الموعد:</label>
        <br>
        <input type="time" name="time" required>

        <br><br>

        <label>ملاحظات إضافية:</label>
        <br>
        <textarea name="notes" rows="5" cols="30"></textarea>

        <br><br>

        <input type="submit" value="تأكيد الحجز">

    </form>

    <hr>

</body>
</html>
